<div id="eyes" aria-hidden="true"></div>
<div class="torch" aria-hidden="true"></div>
<div id="omenToast" class="omen" role="status" aria-live="polite"></div>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="menu">
    <div class="brand">
      <div><b>sweet budget book</b><small>it is always watching</small></div>
      <button type="button" class="closeside" id="closeSide" aria-label="close menu">&times;</button>
    </div>
    <nav class="snav" id="snav" aria-label="pages"></nav>
    <div class="sfoot" id="sfoot"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="app">
    <header class="topbar">
      <button type="button" class="hamb" id="menuBtn" aria-label="open menu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <h1 id="pageTitle">overview</h1>
      <div class="ctrls">
        <div class="monthnav">
          <button type="button" id="prev" aria-label="previous month">&lsaquo;</button>
          <span id="monthLabel" class="num"></span>
          <button type="button" id="next" aria-label="next month">&rsaquo;</button>
        </div>
        <select id="cur" class="sel" aria-label="currency">
          <option value="₹">₹ rupee</option><option value="$">$ dollar</option><option value="€">€ euro</option><option value="£">£ pound</option>
        </select>
      </div>
    </header>

    <div id="sampleBar" class="sample" hidden>
      <span>the rows you see are sample ones so you can try everything. clear them when you're ready to start your own.</span>
      <button type="button" class="btn" id="clearSamples">clear samples</button>
    </div>

    <div id="page"></div>

    <p class="fine" id="status"></p>
  </div>
</div>

<button type="button" class="fab" id="calcFab" hidden><span>calculator</span></button>

<section class="calc" id="calc" hidden aria-label="wishlist calculator">
  <div class="hd">
    <img alt="" data-img="bunny"><b>wishlist calculator</b>
    <button type="button" id="calcMin" aria-label="shrink calculator">&minus;</button>
    <button type="button" id="calcClose" aria-label="close calculator">&times;</button>
  </div>
  <div class="tape" id="calcTape"></div>
  <div class="tot"><span>total of picked things</span><b id="calcTotal">0</b></div>
  <div class="afford" id="calcAfford"></div>
  <div class="lcd" id="calcLcd" aria-live="polite">0</div>
  <div class="keys" id="calcKeys"></div>
</section>
